<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>GameParity</title>
		<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="backdrop" aria-hidden="true"></div>
		<main class="page">
			<div class="top-controls">
				<div id="topbar-left" class="topbar-left"></div>
				<div class="top-controls-right">
					<div id="lang-switch" class="lang-switch"></div>
					<select id="currency-select" class="currency-select" aria-label="Currency"></select>
				</div>
			</div>
			<header id="empty-hero" class="page-header">
				<a class="wordmark" href="/">GameParity</a>
				<p class="tagline">Steam vs Epic Games Store vs GOG, side by side</p>
				<form id="search-form" class="search-form">
					<input
						id="search-input"
						class="search-input"
						type="search"
						name="q"
						placeholder="Search for a game…"
						autocomplete="off"
						required
					/>
					<button type="submit" class="search-button">Search</button>
				</form>
			</header>
			<section id="comparison-view" class="comparison-view" hidden>
				<div id="comparison-root" class="comparison-root"></div>
			</section>
			<footer class="page-footer">
				<a href="https://github.com/mouahrara/GameParity" target="_blank" rel="noopener noreferrer">GitHub</a>
				<span>·</span>
				<span class="footer-note">GameParity is an independent project, not affiliated with Steam, Epic Games Store, or GOG.</span>
			</footer>
		</main>
		<script type="module" src="js/app.js"></script>
	</body>
</html>
